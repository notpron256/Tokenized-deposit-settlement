[package]
name = "compliance-hook"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.1.2"
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.3"
spl-discriminator = "0.4.0"
solana-instructions-sysvar = "3.0.1"
# Phase 6.5: reading the mint's own configured Permanent Delegate directly
# off its extension data, to detect a delegate-authorized (clawback)
# transfer at Execute time. Previously only a dev-dependency (used in
# tests); promoted to a real dependency since fallback() now needs it too.
spl-token-2022-interface = "3.1.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3.5.0"
solana-address = "2.7.0"
solana-sdk-ids = "3.1.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
